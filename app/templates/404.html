{% extends 'base.html' %}

{% block title %}Page Not Found (404) | Jayaprakash Biswal{% endblock %}

{% block content %}
<section class="section" style="min-height: 70vh; display: flex; align-items: center;">
  <div class="container" style="text-align: center; max-width: 600px;">
    <div class="neu-raised" style="padding: var(--space-10);">
      <div style="font-size: 5rem; font-weight: 800; color: var(--accent-primary); line-height: 1; margin-bottom: 1rem;">
        404
      </div>
      <h1 style="font-size: 1.8rem; margin-bottom: 1rem;">{{ error_title or "Page Not Found" }}</h1>
      <p style="margin-bottom: 2rem;">
        {{ error_message or "The page or resource you are looking for does not exist or has been moved." }}
      </p>
      <a href="{{ url_for('routes.index') }}" class="btn btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Return to Portfolio</span>
      </a>
    </div>
  </div>
</section>
{% endblock %}
