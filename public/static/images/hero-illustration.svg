<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" width="100%" height="100%">
  <defs>
    <!-- Neumorphic Drop Shadows -->
    <filter id="heroShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="8" dy="8" stdDeviation="8" flood-color="#C5C9CE" flood-opacity="0.75"/>
      <feDropShadow dx="-8" dy="-8" stdDeviation="8" flood-color="#FFFFFF" flood-opacity="0.95"/>
    </filter>

    <filter id="softPillShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="4" stdDeviation="4" flood-color="#C5C9CE" flood-opacity="0.65"/>
      <feDropShadow dx="-4" dy="-4" stdDeviation="4" flood-color="#FFFFFF" flood-opacity="0.9"/>
    </filter>

    <filter id="insetDisplay">
      <feOffset dx="3" dy="3"/>
      <feGaussianBlur stdDeviation="3" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#C5C9CE" flood-opacity="0.6" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2F5F9"/>
      <stop offset="100%" stop-color="#E2E7ED"/>
    </linearGradient>

    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5577ED"/>
      <stop offset="100%" stop-color="#3A59C8"/>
    </linearGradient>

    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E9F86"/>
      <stop offset="100%" stop-color="#2F6D59"/>
    </linearGradient>

    <linearGradient id="chartWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4568DC" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#5577ED" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3B806B" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Ambient Neumorphic Background Elements -->
  <circle cx="90" cy="80" r="45" fill="#E8ECF1" filter="url(#softPillShadow)" opacity="0.6"/>
  <circle cx="460" cy="360" r="35" fill="#E8ECF1" filter="url(#softPillShadow)" opacity="0.7"/>

  <!-- Main Raised Terminal / Data Canvas -->
  <rect x="50" y="45" width="400" height="280" rx="24" fill="url(#cardGrad)" filter="url(#heroShadow)"/>

  <!-- Terminal Top Bar -->
  <g transform="translate(75, 70)">
    <circle cx="0" cy="0" r="5" fill="#DC2626" opacity="0.8"/>
    <circle cx="16" cy="0" r="5" fill="#D97706" opacity="0.8"/>
    <circle cx="32" cy="0" r="5" fill="#3B806B" opacity="0.8"/>
    <rect x="58" y="-6" width="120" height="12" rx="6" fill="#D6DBE2"/>
  </g>

  <!-- Recessed Code & Analytics Screen -->
  <rect x="75" y="95" width="350" height="205" rx="16" fill="#DFE4EA" filter="url(#insetDisplay)"/>

  <!-- Code Line Visuals -->
  <g transform="translate(95, 120)">
    <!-- def predict_churn(data): -->
    <rect x="0" y="0" width="30" height="7" rx="3.5" fill="#4568DC"/>
    <rect x="36" y="0" width="90" height="7" rx="3.5" fill="#202936"/>
    <rect x="132" y="0" width="38" height="7" rx="3.5" fill="#657080"/>

    <!-- model = load_pipeline() -->
    <rect x="15" y="18" width="42" height="7" rx="3.5" fill="#202936"/>
    <rect x="62" y="18" width="10" height="7" rx="3.5" fill="#4568DC"/>
    <rect x="77" y="18" width="75" height="7" rx="3.5" fill="#3B806B"/>

    <!-- df = pd.DataFrame(data) -->
    <rect x="15" y="36" width="22" height="7" rx="3.5" fill="#202936"/>
    <rect x="42" y="36" width="10" height="7" rx="3.5" fill="#4568DC"/>
    <rect x="57" y="36" width="85" height="7" rx="3.5" fill="#202936"/>
  </g>

  <!-- Data Analytics Wave & Histogram inside screen -->
  <g transform="translate(95, 195)">
    <!-- Bar charts -->
    <rect x="0" y="45" width="12" height="25" rx="3" fill="#B4BAC4"/>
    <rect x="18" y="30" width="12" height="40" rx="3" fill="#4568DC" opacity="0.7"/>
    <rect x="36" y="15" width="12" height="55" rx="3" fill="#4568DC"/>
    <rect x="54" y="25" width="12" height="45" rx="3" fill="#3B806B"/>
    <rect x="72" y="40" width="12" height="30" rx="3" fill="#B4BAC4"/>

    <!-- Smooth Trend Line -->
    <path d="M 110 55 Q 150 15 190 35 T 260 20 T 310 10" 
          fill="none" stroke="url(#chartWave)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Target Nodes -->
    <circle cx="190" cy="35" r="4.5" fill="#4568DC" filter="url(#softPillShadow)"/>
    <circle cx="260" cy="20" r="4.5" fill="#3B806B" filter="url(#softPillShadow)"/>
    <circle cx="310" cy="10" r="5.5" fill="#5577ED" filter="url(#softPillShadow)"/>
  </g>

  <!-- Overlapping Raised AI / Model Badge (Floating Bottom Right) -->
  <g transform="translate(320, 260)" filter="url(#heroShadow)">
    <rect x="0" y="0" width="170" height="85" rx="18" fill="url(#cardGrad)"/>
    
    <!-- Icon Circle -->
    <circle cx="36" cy="42" r="18" fill="url(#accentBlue)"/>
    <path d="M 28 42 L 34 48 L 45 36" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Stats Text Representation -->
    <text x="64" y="36" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#657080" letter-spacing="0.5">MODEL ACCURACY</text>
    <text x="64" y="55" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#202936">8.14 CGPA</text>
  </g>

  <!-- Overlapping Raised Stack Badge (Floating Top Left) -->
  <g transform="translate(15, 230)" filter="url(#heroShadow)">
    <rect x="0" y="0" width="140" height="65" rx="16" fill="url(#cardGrad)"/>
    <circle cx="28" cy="32" r="14" fill="url(#accentGreen)"/>
    <text x="23" y="36" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">&lt;/&gt;</text>
    <text x="50" y="28" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#657080">STACK</text>
    <text x="50" y="44" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#202936">Python / Flask</text>
  </g>
</svg>
