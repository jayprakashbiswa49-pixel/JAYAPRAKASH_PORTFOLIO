<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Soft Neumorphic Gradients -->
    <linearGradient id="raisedSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F8FC"/>
      <stop offset="100%" stop-color="#DEE3E9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5577ED"/>
      <stop offset="100%" stop-color="#3A59C8"/>
    </linearGradient>
    
    <!-- Tactile Drop Shadow Filters -->
    <filter id="neumorphicShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="4" dy="4" stdDeviation="4" flood-color="#C5C9CE" flood-opacity="0.8"/>
      <feDropShadow dx="-4" dy="-4" stdDeviation="4" flood-color="#FFFFFF" flood-opacity="0.95"/>
    </filter>

    <filter id="innerDepth">
      <feOffset dx="2" dy="2"/>
      <feGaussianBlur stdDeviation="2" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#C5C9CE" flood-opacity="0.7" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Raised Base Badge -->
  <rect x="10" y="10" width="80" height="80" rx="22" fill="url(#raisedSurface)" filter="url(#neumorphicShadow)"/>

  <!-- Inset Border Ring -->
  <rect x="11" y="11" width="78" height="78" rx="21" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>

  <!-- JB Modern Geometric Monogram -->
  <g transform="translate(24, 25)">
    <!-- J stroke -->
    <path d="M 12 6 L 22 6 L 22 32 C 22 41 15 45 6 44 C 1 43.5 -1 40 0 37 C 1 34 3.5 34 5.5 35 C 10 37 14 36 14 30 L 14 6 Z" 
          fill="url(#accentGrad)" />
    
    <!-- B stroke -->
    <path d="M 26 6 L 39 6 C 47 6 52 10 52 17 C 52 22 48 24.5 44 25.5 C 49 26.5 53.5 30 53.5 36 C 53.5 43.5 47 47 38 47 L 26 47 Z M 34 13 L 34 22 L 38 22 C 42 22 44.5 20.5 44.5 17.5 C 44.5 14.5 42 13 38 13 Z M 34 29 L 34 40 L 39 40 C 43.5 40 46 38.5 46 34.5 C 46 30.5 43 29 39 29 Z" 
          fill="#202936" />
    
    <!-- Accent Dot -->
    <circle cx="53" cy="11" r="3.5" fill="url(#accentGrad)" filter="url(#neumorphicShadow)"/>
  </g>
</svg>
